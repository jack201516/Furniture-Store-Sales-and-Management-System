<div class="container">

<h2>Add Furniture Item</h2>



<label>Furniture Name</label>
<input type="text" id="fName">

<label>Furniture Description</label>
<textarea id="fDesc"></textarea>



<label>Price per Furniture ($)</label>
<input type="number" id="fPrice">

<div id="materials-container">
    <div class="material-row">
        <label>Material ID</label>
        <input type="text" name="mIds[]">
        <label>Material Quantity</label>
        <input type="number" name="mQtys[]">
    </div>
</div>
<button type="button" onclick="addMaterialRow()">+ Add another material</button>




<button onclick="addFurniture()">
Add Furniture
</button>

</div>

<div class="product-list" id="furniture-list"></div>

<script>

function addFurniture() {
    const furnitureData = {
        fname: document.getElementById("fName").value.trim(),
        fdesc: document.getElementById("fDesc").value.trim(),
        fprice: document.getElementById("fPrice").value,
        mid: document.getElementById("mId").value.trim(),
        mqty: document.getElementById("mQty").value
    };

    if(furnitureData.fname === "" || furnitureData.fprice <= 0 || furnitureData.mqty <= 0) {
        alert("Please fill all fields correctly!");
        return;
    }

    fetch('../php/addpd.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(furnitureData)
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === 'success') {
            alert("Furniture added successfully!");
          
            document.getElementById("fName").value = "";
            document.getElementById("fDesc").value = "";
            document.getElementById("fImage").value = "";
            document.getElementById("fPrice").value = "";
            document.getElementById("mId").value = "";
            document.getElementById("mQty").value = "";
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(err => console.error("Error:", err));
}
function addMaterialRow() {
    const container = document.getElementById('materials-container');
    const row = document.createElement('div');
    row.className = 'material-row';
    row.innerHTML = `
        <label>Material ID</label> <input type="text" name="mIds[]">
        <label>Material Quantity</label> <input type="number" name="mQtys[]">
    `;
    container.appendChild(row);
}

function addFurniture() {
  
    const mIds = Array.from(document.querySelectorAll('input[name="mIds[]"]')).map(i => i.value);
    const mQtys = Array.from(document.querySelectorAll('input[name="mQtys[]"]')).map(i => i.value);

    const furnitureData = {
        fname: document.getElementById("fName").value.trim(),
        fdesc: document.getElementById("fDesc").value.trim(),
        fprice: document.getElementById("fPrice").value,
        materials: mIds.map((id, index) => ({ mid: id, qty: mQtys[index] }))
    };

    fetch('../php/addpd.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(furnitureData)
    }).then(res => res.json()).then(data => {
        if(data.status === 'success') alert("Added successfully!");
    });
}
</script>
