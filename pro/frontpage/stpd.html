<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Product</title>
<style>
body { 
    background-image: url("bg.PNG");
    background-attachment: fixed; 
    background-position: center;
    background-size: cover;

    display: flex;
    flex-direction: column; 

    margin: 0;
    padding-top: 60px; 
}

.navbar {
    background-color: #333;
    padding: 10px;

    display: flex;
    justify-content: space-between;

    position: fixed;
    top: 0;
    width: 100%;
}

.navbar button {
    background-color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
}

.navbar button:hover {
    background-color: #ddd;
}

/* Title */

.title{
    background-color: white;

    padding: 10px 20px;
    border-radius: 8px;

    width: fit-content;
    margin: 20px auto;
}

/* Product List */

.product-list{
    width: 80%;
    margin: auto;
}

.product-item{

    background-color: white;

    padding: 15px;
    margin: 15px 0;

    border-radius: 10px;

    display: flex;
    gap: 20px;
    align-items: center;
}

/* Image */

.product-item img{

    width: 100px;
    height: 100px;

    object-fit: cover;

    border-radius: 8px;
}

/* Info */

.product-info{
    flex-grow: 1;
}

/* Buttons */

.delete-btn{

    background-color: red;
    color: white;

    border: none;
    padding: 6px 10px;

    border-radius: 5px;
    cursor: pointer;
}

.delete-btn:hover{
    background-color: darkred;
}

.add-btn{

    background-color: black;
    color: white;

    border: none;
    padding: 10px 20px;

    border-radius: 6px;

    cursor: pointer;

    display: block;
    margin: 20px auto;
}

</style>

</head>

<body>

<div class="navbar">

<button onclick="location.href='stpd.html'">
Furniture list
</button>

<button onclick="location.href='strp.html'">
order list
</button>

<button onclick="location.href='mt.html'">
Material list
</button>
<button onclick="location.href='report.html'">
Report
</button>

<button onclick="location.href='../login/login_st.html'">
Log out
</button>

</div>

<h1 class="title">Staff Product List</h1>

<button class="add-btn" onclick="location.href='addpd.html'">+ Add Furniture</button>

<table class="product-table" style="width:90%; margin: 20px auto; border-collapse: collapse; background:white;">
    <thead>
        <tr style="background:#333; color:white;">
            <th style="padding:10px;">ID</th>
            <th style="padding:10px;">Name</th>
            <th style="padding:10px;">Price</th>
            <th style="padding:10px;">Action</th>
        </tr>
    </thead>
    <tbody id="product-list">
        </tbody>
</table>

<script>
function fetchProducts() {
    fetch('../php/stpd.php')
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById("product-list");
            list.innerHTML = "";
            
            data.forEach(item => {
                const row = document.createElement("tr");
                row.style.borderBottom = "1px solid #ddd";
                row.style.textAlign = "center";
                row.innerHTML = `
                    <td style="padding:10px;">${item.fid}</td>
                    <td style="padding:10px;">${item.fname}</td>
                    <td style="padding:10px;">$${item.fprice}</td>
                    <td style="padding:10px;">
                        <button class="delete-btn" onclick="deleteProduct(${item.fid})">Delete</button>
                    </td>
                `;
                list.appendChild(row);
            });
        })
        .catch(err => console.error("Error loading products:", err));
}

function deleteProduct(fid) {
    if(confirm("Are you sure you want to delete this furniture item?")) {
        fetch('../php/delete_furniture.php', {
            method: 'POST',
            body: JSON.stringify({ fid: fid }),
            headers: {'Content-Type': 'application/json'}
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                alert("Deleted successfully.");
                fetchProducts(); 
            } else {
                alert(data.message); 
            }
        })
        .catch(err => console.error("Error deleting:", err));
    }
}


fetchProducts();
</script>

</body>
</html>
