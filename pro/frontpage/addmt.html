<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Add Material</title>

<style>
body {
    font-family: Arial;
    background-color: #f5f5f5;
    margin: 0;
    padding-top: 60px;
}

.navbar {
    background-color: #333;
    padding: 10px;
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
}

.navbar button {
    background-color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
}

.navbar button:hover {
    background-color: #ddd;
}

.container {
    background-color: white;
    width: 500px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
}

button.add-btn {
    background-color: white;
    color: black;
    border: 1px solid black;
    padding: 10px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
}

button.add-btn:hover {
    background-color: #eee;
}

.product-list {
    width: 80%;
    margin: 20px auto;
}

.product-item {
    background-color: white;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="navbar">
    <button onclick="location.href='mt.html'">Back</button>
</div>

<div class="container">
<h2>Add Material</h2>



<label>Material Name</label>
<input type="text" id="mName">

<label>Physical Quantity</label>
<input type="number" id="mQty" min="1" required>

<label>Unit</label>
<input type="text" id="mUnit">

<button class="add-btn" onclick="addMaterial()">Add Material</button>
</div>

<div class="product-list" id="material-list"></div>

<script>
function addMaterial(){
    let name = document.getElementById("mName").value.trim();
    let qty = document.getElementById("mQty").value;
    let unit = document.getElementById("mUnit").value.trim();

    if(name === "" || qty === "" || unit === ""){
        alert("Please fill all information!");
        return;
    }

  
    fetch('../php/addmt.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            mname: name,
            mqty: qty,
            munit: unit
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success"){
            alert("Material added successfully!");
            
            document.getElementById("mName").value = "";
            document.getElementById("mQty").value = "";
            document.getElementById("mUnit").value = "";
        } else {
            alert("Error: " + data.message);
        }
    });
}
</script>

</body>
</html>
